name: Tests
on:
  - pull_request
jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust + components
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.86
          components: rustfmt,clippy
      - name: Install Rust code coverage
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Run syntax and style tests
        run: cargo clippy --all-targets -- -D warnings
      - name: Run format test
        run: cargo fmt --check
      - name: Run integration tests w/ coverage report
        env:
          RUST_BACKTRACE: full
        run: |
          mkdir -p tests/.tmp
          cargo llvm-cov \
            --ignore-filename-regex "bin/.*|lib\.rs" \
            --codecov \
            --output-path target/llvm-cov-target/codecov.json \
            -- \
              --nocapture
      - name: Upload to codecov.io
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: true
          files: target/llvm-cov-target/codecov.json
          verbose: true
